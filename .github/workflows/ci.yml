name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: altair-plugin-models
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega
          path: altair-plugin-models/.dependencies/vega
          persist-credentials: false
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-renderer-three
          path: altair-plugin-models/.dependencies/vega-renderer-three
          persist-credentials: false
          ref: 33a9127d9537cc5c303fceaa35fafda403713b42
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/vega-plugin-composite
          path: altair-plugin-models/.dependencies/vega-plugin-composite
          persist-credentials: false
          ref: 5c151e08ee4e8cad9a0fbd98e97d06260b507b66
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair
          path: altair-plugin-models/.dependencies/altair
          persist-credentials: false
          ref: cd4e44d0670df22fe2e8f8ae3ebab3ab8365766d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: haneoka-gakuen/altair-plugin-adv
          path: altair-plugin-models/.dependencies/altair-plugin-adv
          persist-credentials: false
          ref: bfc4061296dfa589b6b8d586a369b3ff445c340d
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - working-directory: altair-plugin-models
        run: pnpm install --no-frozen-lockfile
      - working-directory: altair-plugin-models
        run: |
          pnpm --filter @haneoka/vega-protocol build
          pnpm --filter @haneoka/vega build:core
          pnpm --filter @haneoka/vega-renderer-three build
          pnpm --filter @haneoka/vega-plugin-composite build
          pnpm --filter @haneoka/altair build:core
          pnpm --filter @haneoka/altair-ui-react build
          pnpm --filter @haneoka/altair-plugin-adv build
      - working-directory: altair-plugin-models
        run: pnpm check
